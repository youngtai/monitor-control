[package]
name = "monitor-control"
version = "0.2.3"
edition = "2021"
rust-version = "1.92"
description = "Native external monitor brightness control"
repository = "https://github.com/youngtai/monitor-control"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
async-channel = "2"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
sha2 = "0.10"
libc = "0.2"

[build-dependencies]
cc = "1"

[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "monitor-control"
path = "src/main.rs"
